  <path d="M256 180 C215 180 195 230 195 285 C195 345 220 380 256 380 C292 380 317 345 317 285 C317 230 297 180 256 180 Z" fill="#9333ea" opacity="0.8"/>
  <path d="M256 220 C235 220 225 255 225 290 C225 330 240 355 256 355 C272 355 287 330 287 290 C287 255 277 220 256 220 Z" fill="#6b21a8"/>
  <!-- Lightning speed bolt -->
